name: Build

on:
  push:

permissions:
  contents: read

jobs:
  run_tests:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Verify checkout token
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          if [ -z "$ACTIONS_TOKEN" ]; then
            echo "::error::ACTIONS_TOKEN is not available to this workflow run."
            exit 1
          fi

          echo "Checking REST API access to WHS-FRC-3467/W8-Library"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/WHS-FRC-3467/W8-Library \
            > /dev/null

          echo "Checking REST API access to WHS-FRC-3467/C2"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/WHS-FRC-3467/C2 \
            > /dev/null

          echo "Checking Git access to WHS-FRC-3467/W8-Library"
          git ls-remote "https://oauth2:${ACTIONS_TOKEN}@github.com/WHS-FRC-3467/W8-Library.git" HEAD > /dev/null

          echo "Checking Git access to WHS-FRC-3467/C2"
          git ls-remote "https://oauth2:${ACTIONS_TOKEN}@github.com/WHS-FRC-3467/C2.git" HEAD > /dev/null
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: WHS-FRC-3467/W8-Library
          ref: ${{ github.ref }}
          submodules: recursive
          token: ${{ secrets.ACTIONS_TOKEN }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Robot Code
        run: ./gradlew build -x test --stacktrace --info --no-daemon
      - name: Test Robot Code
        run: ./gradlew test --stacktrace --info --no-daemon
      - name: Check Formatting
        run: ./gradlew spotlessCheck --stacktrace --info --no-daemon
